name: Docs Preview

# Split out of Documentation.yml, which used to build the live site and post the PR preview
# comment in one job. The reusable pair separates them because the deploy runs on `main` and the
# preview runs on a pull request, and the two need different permissions.
on: { pull_request: {} }
jobs:
  preview:
    uses: QAtlasHub/.github/.github/workflows/docs-preview.yml@main
    secrets: inherit
